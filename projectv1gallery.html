<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3 Column Flex Layout</title>
  <style>

    html, body {
      height: 100%;
      background-color: #223d3c;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    
    #navbar {
    display: flex;
    justify-content: space-evenly;
    align-items: center;
    margin: 0px;
    padding: 0;
    background-color: white;
  }

  #navbar li {
    border: 1px solid #223d3c;
    list-style-type: none;
  }

  #navbar li a {
    display: block;
    color: #223d3c;
    text-align: center;
    padding: 14px 16px;
    text-decoration: none;
  }

  #navbar li a:hover {
    background-color: lightgreen;
  }

    .main {
      flex: 1;
      display: flex;
      padding: 10px;
      background-color:#223d3c;
    }

    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
    }

    .left { background-color: #223d3c; }
    .middle { background-color: #223d3c; }
    .right { background-color: #223d3c; }

    .box {
      background-color: white;
      border: 1px solid #ccc;
      padding: 20px;
      text-align: center;
      flex: 1;
    }

  </style>
</head>
<body>
